name: Publish Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Publish Native Runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Package Windows Binary
        run: |
          mkdir -p dist
          if [ -f runtimes/win-x64/AdvSmartSdk.dll ]; then
            zip -j dist/AdvSmartSdk-win-x64.zip runtimes/win-x64/AdvSmartSdk.dll
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            runtimes/win-x64/AdvSmartSdk.dll
          draft: false
          prerelease: false
