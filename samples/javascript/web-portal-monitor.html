<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoID Real-Time RFID Portal Monitor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }
    .status-badge.connected {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-title { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #111e38; padding: 12px 16px; font-size: 0.85rem; color: var(--text-muted); }
    td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.9rem; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-in { background: rgba(56, 189, 248, 0.2); color: var(--accent); }
    .badge-out { background: rgba(249, 115, 22, 0.2); color: #f97316; }
  </style>
</head>
<body>
  <header>
    <h1>📡 AutoID Portal Live Monitor</h1>
    <div id="connStatus" class="status-badge">● Disconnected</div>
  </header>

  <div class="grid">
    <div class="stat-card">
      <div class="stat-title">Total Read Events</div>
      <div id="totalReads" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Unique EPCs</div>
      <div id="uniqueEpcs" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Inbound Transits</div>
      <div id="inboundCount" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Outbound Transits</div>
      <div id="outboundCount" class="stat-value">0</div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>EPC</th>
          <th>RSSI</th>
          <th>Antenna</th>
          <th>Direction / Event</th>
        </tr>
      </thead>
      <tbody id="tagTableBody">
        <tr>
          <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 32px;">
            Connecting to AutoID Gateway at ws://127.0.0.1:18080/ws/events ...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let ws;
    let totalReads = 0;
    const epcSet = new Set();
    let inbound = 0;
    let outbound = 0;

    function connect() {
      ws = new WebSocket('ws://127.0.0.1:18080/ws/events');
      const badge = document.getElementById('connStatus');

      ws.onopen = () => {
        badge.textContent = '● Live Connected';
        badge.classList.add('connected');
        document.getElementById('tagTableBody').innerHTML = '';
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'tag') {
          totalReads++;
          epcSet.add(msg.payload.epc);
          document.getElementById('totalReads').textContent = totalReads;
          document.getElementById('uniqueEpcs').textContent = epcSet.size;
          appendRow(msg.payload.epc, msg.payload.rssi, msg.payload.antenna, 'Tag Read');
        } else if (msg.type === 'direction') {
          const isOut = msg.payload.direction === 'InToOut';
          if (isOut) { outbound++; document.getElementById('outboundCount').textContent = outbound; }
          else { inbound++; document.getElementById('inboundCount').textContent = inbound; }
          appendRow(msg.payload.epc, '-', '-', msg.payload.direction, isOut ? 'badge-out' : 'badge-in');
        }
      };

      ws.onclose = () => {
        badge.textContent = '● Disconnected';
        badge.classList.remove('connected');
        setTimeout(connect, 3000);
      };
    }

    function appendRow(epc, rssi, antenna, status, badgeClass) {
      const tbody = document.getElementById('tagTableBody');
      const tr = document.createElement('tr');
      const time = new Date().toLocaleTimeString();
      const statusHtml = badgeClass ? `<span class="badge ${badgeClass}">${status}</span>` : status;
      tr.innerHTML = `<td>${time}</td><td><code>${epc}</code></td><td>${rssi} dBm</td><td>Ant ${antenna}</td><td>${statusHtml}</td>`;
      tbody.insertBefore(tr, tbody.firstChild);
      if (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
    }

    connect();
  </script>
</body>
</html>
