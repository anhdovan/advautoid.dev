<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow & Background Tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#omniGrad)" filter="url(#glow)" />
  
  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- RFID Signal Wave Left -->
  <path d="M 28 48 A 20 20 0 0 0 28 80" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  
  <!-- RFID Signal Wave Right -->
  <path d="M 100 48 A 20 20 0 0 1 100 80" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Central Omega (Ω) Symbol -->
  <path d="M 44 88 L 54 88 C 55 82 53 76 50 71 C 45 63 45 52 52 44 C 59 36 71 36 78 44 C 85 52 85 63 80 71 C 77 76 75 82 76 88 L 86 88 C 88 88 89 86 88 84 C 86 78 89 71 93 64 C 99 53 98 39 88 29 C 75 16 53 16 40 29 C 30 39 29 53 35 64 C 39 71 42 78 40 84 C 39 86 40 88 44 88 Z" fill="#ffffff" />
</svg>
